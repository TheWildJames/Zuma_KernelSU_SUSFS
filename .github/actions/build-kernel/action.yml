name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  bypass:
    description: 'Whether to add the bypass hack or not'
    required: true
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true

runs:
  using: composite
  steps:
  - name: 'Build Kernel'
    shell: bash
    if: false
    working-directory: ${{ github.workspace }}/kernel
    run: |
      sed -i 's/check_defconfig//' ./common/build.config.gki
      if [ -f "build/build.sh" ]; then
        BUILD_GKI_ARTIFACTS="" \
        BUILD_GKI_CERTIFICATION_TOOLS=0 \
        BUILD_SYSTEM_DLKM=0 \
        SKIP_VENDOR_BOOT=1 \
        SKIP_EXT_MODULES=1 \
        SKIP_CP_KERNEL_HDR=1 \
        OUT_DIR="/home/runner/out" \
        LTO=thin \
        BUILD_CONFIG=common/build.config.gki.aarch64 \
        build/build.sh -j"$(nproc)" \
        CC="/usr/bin/ccache clang" \
        CXX="/usr/bin/ccache clang+" \
        HOSTCC="/usr/bin/ccache clang" \
        HOSTCXX="/usr/bin/ccache clang+"
      else
        tools/bazel build \
          --config=fast \
          --config=stamp \
          --disk_cache=/home/runner/.cache/bazel \
          //common:kernel_aarch64/Image
      fi

  - name: Build defconfig
    working-directory: ${{ github.workspace }}/kernel
    shell: bash
    run: |
      make ARCH=arm64 \
        O=/home/runner/out \
        CC=$GITHUB_WORKSPACE/neutron-clang/bin/clang \
        LD=$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld \
        AR=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-ar \
        NM=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-nm \
        OBJCOPY=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-objcopy \
        OBJDUMP=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-objdump \
        STRIP=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-strip \
        CROSS_COMPILE=$GITHUB_WORKSPACE/neutron-clang/bin/aarch64-linux-gnu- \
        CROSS_COMPILE_COMPAT=$GITHUB_WORKSPACE/neutron-clang/bin/arm-linux-gnueabi- \
        LLVM=1 \
        LLVM_IAS=1 \
        -j$(nproc --all) ${{ inputs.codename }}_defconfig

  - name: Build kernel
    working-directory: ${{ github.workspace }}/kernel
    shell: bash
    run: |
      make ARCH=arm64 \
        O=/home/runner/out \
        CC=$GITHUB_WORKSPACE/neutron-clang/bin/clang \
        LD=$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld \
        AR=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-ar \
        NM=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-nm \
        OBJCOPY=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-objcopy \
        OBJDUMP=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-objdump \
        STRIP=$GITHUB_WORKSPACE/neutron-clang/bin/llvm-strip \
        CROSS_COMPILE=$GITHUB_WORKSPACE/neutron-clang/bin/aarch64-linux-gnu- \
        CROSS_COMPILE_COMPAT=$GITHUB_WORKSPACE/neutron-clang/bin/arm-linux-gnueabi- \
        LLVM=1 \
        LLVM_IAS=1 \
        LOCALVERSION_AUTO=0 \
        -j$(nproc --all)

  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail

      cp "/home/runner/out/Image.lz4" "${{ github.workspace }}/AnyKernel3/Image.lz4"
